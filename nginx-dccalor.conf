# Configuração Nginx para o DCCALOR (Proxy Reverso)
# Pode ser colocado em /etc/nginx/sites-available/dccalor e linkado em /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _; # Substitua pelo domínio corporativo ou IP da VM se necessário

    # Logs de acesso e erro
    access_log /var/log/nginx/dccalor_access.log;
    error_log /var/log/nginx/dccalor_error.log;

    # Limite de tamanho de requisição para relatórios e payloads
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para análises da IA Gemini
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }
}
