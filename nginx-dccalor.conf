# ==========================================================
# Configuração Nginx: DCCALOR (Sistema Principal) + DCPET (Subsistema)
# Local na VM: /etc/nginx/sites-available/dccalor
# Link ativo: /etc/nginx/sites-enabled/dccalor
# ==========================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Logs de acesso e erro
    access_log /var/log/nginx/dccalor_access.log;
    error_log /var/log/nginx/dccalor_error.log;

    # Limite de tamanho de requisição para relatórios e payloads
    client_max_body_size 20M;

    # Suporte para quem digitar /dccalor no navegador -> Redireciona suavemente para a raiz
    location = /dccalor {
        return 301 /;
    }
    location /dccalor/ {
        return 301 /;
    }

    # Redirecionamento de barra para o DCPET
    location = /dcpet {
        return 301 /dcpet/;
    }

    # Subsistema DCPET (Saúde Animal)
    location /dcpet/ {
        # Mantém o proxy para a porta do DCPET configurada no container
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Sistema Principal: DCCALOR (na raiz /)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para análises da IA Gemini
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }
}
